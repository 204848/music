<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Meekdai music player page with journal">
    <meta property="og:title" content="Gmemp">
    <meta property="og:description" content="Meekdai music player page with journal">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://music.1357924680liu.dpdns.org/">
    <meta property="og:image" content=""/>
    <link rel="icon" href="favicon.svg">
    <title>Gmemp</title>
    <link rel="stylesheet" href="player.css">
</head>
<body>
    <!-- 背景层 -->
    <div id="bg-layer1" class="bg-layer"></div>
    <div id="bg-layer2" class="bg-layer"></div>
    <canvas id="waveCanvas"></canvas>
    <div id="loading"></div>

    <!-- 顶部信息 -->
    <div id="top-info">
        <div id="track"></div>
        <div id="artist"></div>
    </div>
    
    <!-- 全屏日志文章 -->
    <div id="post-panel" class="panel">
        <div id="post-content"></div>
    </div>

    <!-- 歌词容器 -->
    <div id="lyric-container">
        <div id="lyric-prev" class="lyric-line"></div>
        <div id="lyric-current" class="lyric-line"></div>
        <div id="lyric-next" class="lyric-line"></div>
    </div>

    <!-- 底部控制中心 -->
    <div id="player-controls">
        <!-- 进度条区域 -->
        <div class="progress-container">
            <div id="timer">0:00</div>
            <div id="progress-bar">
                <div id="progress-loaded"></div>
                <div id="progress-played"></div>
                <div id="progress-slider"></div>
            </div>
            <div id="duration">0:00</div>
        </div>

        <!-- 控制按钮区域 -->
        <div class="buttons-container">
            <div class="main-controls">
                <div class="btn" id="prevBtn" title="上一首"></div>
                <div class="btn" id="playBtn" title="播放"></div>
                <div class="btn" id="pauseBtn" title="暂停"></div>
