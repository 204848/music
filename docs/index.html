<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Meekdai music player page with journal">
  <meta property="og:title" content="Gmemp">
  <meta property="og:description" content="Meekdai music player page with journal">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://music.1357924680liu.dpdns.org/">
  <meta property="og:image" content="" />

  <link rel="icon" href="favicon.svg">
  <title>Gmemp</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <!-- 背景层 -->
  <div id="bg-layer1" class="bg-layer"></div>
  <div id="bg-layer2" class="bg-layer"></div>

  <!-- 顶部信息 -->
  <div id="top-info">
    <div id="title"></div>
    <div id="artist"></div>
  </div>
  
  <!-- 作者的话/文章 -->
  <div id="post" style="display:none;"></div>
  
  <!-- 加载动画 -->
  <div id="loading"></div>

  <!-- 歌词显示区 -->
  <div id="lyric-wrapper">
      <div id="lyric-prev" class="lyric-line"></div>
      <div id="lyric-current" class="lyric-line"></div>
      <div id="lyric-next" class="lyric-line"></div>
  </div>

  <!-- 歌单面板 -->
  <div id="playlist-panel">
    <div class="playlist-header">
      <h3>播放列表</h3>
      <span id="close-playlist-btn">&times;</span>
    </div>
    <div id="list"></div>
  </div>

  <!-- 节奏条 Canvas -->
  <canvas id="waveCanvas"></canvas>

  <!-- 底部控制栏 -->
  <div id="player-controls">
    <!-- 进度条 -->
    <div id="progress-container">
      <span id="timer">0:00</span>
      <div id="progress-bar">
        <div id="progress-buffered"></div>
        <div id="progress-played"></div>
        <div id="progress-thumb"></div>
      </div>
      <span id="duration">0:00</span>
