<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Meekdai music player page with journal">
  <meta property="og:title" content="Gmemp">
  <meta property="og:description" content="Meekdai music player page with journal">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://music.1357924680liu.dpdns.org/">
  <meta property="og:image" content="" />

  <link rel="icon" href="favicon.svg">
  <title>Gmemp</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <div id="bg-layer1" class="bg-layer"></div>
  <div id="bg-layer2" class="bg-layer"></div>

  <div id="title">
    <span id="track"></span>
    <div id="artist"></div>
    <div id="lyricContainer">
      <div id="lyrics-wrapper"></div>
    </div>
    <!-- 时间显示从全屏进度条移至此处 -->
    <div id="timer">0:00</div>
    <div id="duration">0:00</div>
    <div id="post" style="display:none;"></div>
  </div>
  
  <!-- 保留原有控制按钮 -->
  <div class="controlsOuter">
    <div class="controlsInner">
      <div id="loading"></div>
      <div class="btn" id="playBtn" title="播放"></div>
      <div class="btn" id="pauseBtn" title="暂停"></div>
      <div class="btn" id="nextBtn"></div>
      <div class="btn" id="prevBtn"></div>
    </div>
    <div class="btn" id="lyricBtn" title="歌词开关"></div>
    <div class="btn" id="transBtn" title="翻译开关" style="display:none;">译</div> <!-- 初始隐藏，有翻译再显示 -->
    <div class="btn" id="playlistBtn" title="歌单"></div>
    <div class="btn" id="modeBtn" title="顺序播放"></div>
    <div class="btn" id="postBtn" title="简介/本人的话"></div>
    <div class="btn" id="waveBtn" title="节奏条开关"></div>
    <div class="btn" id="volumeBtn" title="音量调节">
      <div id="volume-popup" class="volume-popup">
        <div class="volume-bar-container">
          <div id="volume-bar-track" class="volume-bar-track"> <!-- Make sure this has an ID -->
            <div id="volume-bar-filled" class="volume-bar-filled"></div>
          </div>
          <div id="volume-percentage" class="volume-percentage">100%</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 新增：标准底部进度条容器 -->
  <div id="progress-container">
    <div id="progress-bar">
      <div id="progress-filled"></div>
      <div id="progress-slider"></div>
    </div>
    <!-- 时间显示与进度条同行 -->
    <div id="progress-time-display">
      <span id="progress-current-time">0:00</span> / <span id="progress-duration">0:00</span>
    </div>
  </div>

  <canvas id="waveCanvas"></canvas>

  <div id="playlist">
    <div id="list"></div>
  </div>

  <!-- howler.min.js 必须在任何依赖它的模块之前加载，并且作为普通脚本加载 -->
  <script src="howler.min.js"></script>
  <!-- 你的模块，作为 ES Module 加载 -->
  <script type="module" src="main.js"></script>
</body>
</html>
