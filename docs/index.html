<!doctype html>
    <div id="artist"></div>
  </div>

  <!-- 新的歌词视图 -->
  <div id="lyric-view">
    <div id="lyric-prev" class="lyric-line"></div>
    <div id="lyric-current" class="lyric-line"></div>
    <div id="lyric-next" class="lyric-line"></div>
  </div>
  
  <!-- "简介/本人的话" 弹窗 -->
  <div id="post-overlay" class="modal-overlay">
      <div id="post"></div>
  </div>

  <!-- 加载动画 -->
  <div id="loading"></div>

  <!-- 可滑出的播放列表 -->
  <div id="playlist">
    <div id="list"></div>
  </div>

  <!-- 底部固定播放条 -->
  <footer id="player-bar">
    <!-- 播放控制 (左) -->
    <div class="bar-section" id="controls-left">
      <div class="btn" id="prevBtn" title="上一首"></div>
      <div class="btn" id="playBtn" title="播放"></div>
      <div class="btn" id="pauseBtn" title="暂停"></div>
      <div class="btn" id="nextBtn" title="下一首"></div>
    </div>

    <!-- 进度条 (中) -->
    <div class="bar-section" id="progress-container">
      <div id="timer">0:00</div>
      <div id="progress-bar-wrapper">
        <div id="progress-bar-bg"></div>
        <div id="progress-bar-fg"></div>
        <div id="progress-handle"></div>
      </div>
      <div id="duration">0:00</div>
    </div>

    <!-- 功能按钮 (右) -->
    <div class="bar-section" id="controls-right">
      <div id="volume-control">
        <div class="btn" id="volumeBtn" title="音量"></div>
        <div id="volume-popup">
            <div id="volume-percentage">100%</div>
            <div id="volume-slider-wrapper">
                <div id="volume-slider-bg"></div>
                <div id="volume-slider-fg"></div>
                <div id="volume-handle"></div>
            </div>
        </div>
      </div>
      <div class="btn" id="modeBtn" title="顺序播放"></div>
      <div class="btn" id="lyricBtn" title="歌词开关"></div>
      <div class="btn" id="waveBtn" title="节奏条开关"></div>
      <div class="btn" id="postBtn" title="简介/本人的话"></div>
      <div class="btn" id="playlistBtn" title="播放列表"></div>
    </div>
  </footer>

  <script src="howler.min.js"></script>
  <script src="player.js"></script>
</body>
</html>
