<!doctype html>
    <div id="artist"></div>
  </div>

  <!-- 作者的话/简介 面板 -->
  <div id="post"></div>

  <!-- 播放列表面板 -->
  <div id="playlist">
      <div id="list"></div>
  </div>

  <!-- 新版三行歌词容器 -->
  <div id="lyric-container">
      <div id="lyric-prev" class="lyric-line"></div>
      <div id="lyric-current" class="lyric-line"></div>
      <div id="lyric-next" class="lyric-line"></div>
  </div>

  <!-- 底部播放控制条 -->
  <div id="player-bar">
      <!-- 左侧控制按钮 -->
      <div class="bar-section left">
          <div class="btn" id="prevBtn" title="上一首"></div>
          <div class="btn" id="playBtn" title="播放"></div>
          <div class="btn" id="pauseBtn" title="暂停"></div>
          <div class="btn" id="nextBtn" title="下一首"></div>
      </div>

      <!-- 中央进度条 -->
      <div class="bar-section middle">
          <div id="timer">0:00</div>
          <div id="progress-container">
              <div id="bar-bg"></div>
              <div id="bar-progress"></div>
              <div id="progress-thumb"></div>
          </div>
          <div id="duration">0:00</div>
      </div>

      <!-- 右侧功能按钮 -->
      <div class="bar-section right">
          <div id="volume-wrapper">
              <div class="btn" id="volumeBtn" title="音量"></div>
              <div id="volume-control">
                  <span id="volume-percent">100%</span>
                  <div id="volume-bar-container">
                      <div id="volume-bar-bg"></div>
                      <div id="volume-bar-progress"></div>
                      <div id="volume-thumb"></div>
                  </div>
              </div>
          </div>
          <div class="btn" id="modeBtn" title="顺序播放"></div>
          <div class="btn" id="lyricBtn" title="歌词开关"></div>
          <div class="btn" id="postBtn" title="简介/本人的话"></div>
          <div class="btn" id="waveBtn" title="频谱开关"></div>
          <div class="btn" id="playlistBtn" title="播放列表"></div>
      </div>
  </div>

  <!-- 加载动画 -->
  <div id="loading"></div>
  
  <script src="howler.min.js"></script>
  <script src="player.js"></script>
</body>
</html>
