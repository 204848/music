<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Meekdai music player page with journal">
  <meta property="og:title" content="Gmemp">
  <meta property="og:description" content="Meekdai music player page with journal">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://music.1357924680liu.dpdns.org/">
  <meta property="og:image" content="" />

  <link rel="icon" href="favicon.svg">
  <title>Gmemp</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <!-- 背景层 (保持不变) -->
  <div id="bg-layer1" class="bg-layer"></div>
  <div id="bg-layer2" class="bg-layer"></div>

  <!-- 顶部信息和新歌词容器 -->
  <div id="top-info-container">
    <span id="title"></span>
    <div id="artist"></div>
    <div id="post" style="display:none;"></div>

    <!-- 新的三行歌词容器 -->
    <div id="lyric-wrapper">
        <div id="lyric-prev" class="lyric-line"></div>
        <div id="lyric-current" class="lyric-line"></div>
        <div id="lyric-next" class="lyric-line"></div>
    </div>
  </div>

  <!-- 原有的时间显示，会被CSS隐藏，但保留以防JS依赖 -->
  <div id="timer" style="display: none;">0:00</div>
  <div id="duration" style="display: none;">0:00</div>

  <!-- 原有的控制按钮，会被CSS隐藏 -->
  <div class="controlsOuter" style="display: none;">
    <div class="controlsInner">
      <div id="loading"></div>
      <!-- 注：按钮的DOM元素会被JS逻辑找到，但我们会在新布局中重新使用它们，所以这里只是占位 -->
    </div>
  </div>

  <!-- 原有的进度条和波形图，会被CSS隐藏或重新定位 -->
  <div id="progressBar"></div>
  <div id="progress"></div>
  <canvas id="waveCanvas"></canvas>

  <!-- 原有的歌单和音量调节浮层，会被CSS隐藏 -->
  <div id="playlist" style="display: none !important;">_</div>
  <div id="volume" style="display: none !important;">_</div>
